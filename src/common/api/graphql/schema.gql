# ================================
# Scalars
# ================================

scalar JSON
scalar Upload

# ================================
# Enums
# ================================

enum OrderBy {
  ORDER_INDEX
}

enum MemberRole {
  OWNER
  ADMIN
  MEMBER
}

enum BoardBackground {
  BLUE
  ORANGE
  GREEN
  RED
  PURPLE
  GREY

  GRADIENT_BUBBLE
  GRADIENT_SNOW
  GRADIENT_OCEAN
  GRADIENT_CRYSTAL
  GRADIENT_RAINBOW
  GRADIENT_PEACH
  GRADIENT_FLOWER
  GRADIENT_EARTH
  GRADIENT_ALIEN
  GRADIENT_VOLCANO
}

enum CardContainer {
  INBOX
  COLUMN
}

# ================================
# Shared Types
# ================================

type User {
  id: ID!
  email: String!
  name: String!
  avatarUrl: String
}

type UserEmailLookup {
  email: String!
}

type Invite {
  id: ID!
  email: String!
  role: MemberRole!
  expiresAt: String!
  canRevoke: Boolean!
}

type RevokeInvitePayload {
  inviteId: ID!
  resourceId: ID!
}

type RemoveMemberPayload {
  resourceId: ID!
  removedMemberId: ID!
  removedWasSelf: Boolean!
}

# ================================
# Board - Dashboard Layer
# ================================

type BoardListItem {
  id: ID!
  title: String!
  previewUrl: String
  updatedAt: String!
  membersCount: Int!
  myRole: MemberRole!
  myMemberId: ID!
  canEdit: Boolean!
  canDelete: Boolean!
  canManagePermissions: Boolean!
}

type BoardPermissionsItem {
  id: ID!
  myRole: MemberRole!
  members: [BoardMember!]!
  invites: [Invite!]!
}

type BoardMember {
  id: ID!
  role: MemberRole!
  user: User!
  isSelf: Boolean!
  canRemove: Boolean!
  canChangeRole: Boolean!
  availableRoles: [MemberRole!]!
}

input UpdateBoardInput {
  title: String
  previewImage: Upload
  removePreview: Boolean
}

type UpdateBoardPayload {
  id: ID!
  title: String!
  previewUrl: String
}

type CreateBoardPayload {
  id: ID!
}

type DeleteBoardPayload {
  id: ID!
}

type ChangeBoardMemberRolePayload {
  boardId: ID!
  updatedMembers: [BoardMember!]!
}

# ================================
# Board - Realtime Domain
# ================================

type Board {
  id: ID!
  title: String!
  panelLayout: PanelLayout!
  inboxBackground: BoardBackground!
  boardBackground: BoardBackground!
  revision: Int!

  inboxCards(orderBy: OrderBy): [BoardCard!]!
  columns(orderBy: OrderBy): [BoardColumn!]!
}

type PanelLayout {
  inbox: Float
  board: Float
}

type BoardCard {
  id: ID!
  title: String!
  completed: Boolean!
  position: Float!
}

type BoardColumn {
  id: ID!
  title: String!
  position: Float!
  cards(orderBy: OrderBy): [BoardCard!]!
}

# ---- Events ----

type BoardRenamed {
  revision: Int!
  title: String!
}

type BoardBackgroundChanged {
  revision: Int!
  background: BoardBackground!
}

type InboxBackgroundChanged {
  revision: Int!
  background: BoardBackground!
}

type ColumnSnapshot {
  id: ID!
  title: String!
  position: Float!
}

type ColumnCreated {
  revision: Int!
  clientId: ID!
  column: ColumnSnapshot!
  index: Int!
}

type ColumnMoved {
  revision: Int!
  columnId: ID
  position: Float!
}

type ColumnRenamed {
  revision: Int!
  columnId: ID
  title: String!
}

type ColumnDeleted {
  revision: Int!
  columnId: ID
}

type CardSnapshot {
  id: ID!
  title: String!
  position: Float!
  completed: Boolean!
}

type CardCreated {
  revision: Int!
  clientId: ID!
  card: CardSnapshot!
  container: CardContainer!
  columnId: ID
  index: Int!
}

type CardMoveTarget {
  container: CardContainer!
  columnId: ID
  position: Float!
}

type CardMoved {
  revision: Int!
  cardId: ID!
  to: CardMoveTarget!
}

type CardPatchPayload {
  title: String
  completed: Boolean
}

type CardUpdated {
  revision: Int!
  cardId: ID!
  patch: CardPatchPayload!
}

type CardDeleted {
  revision: Int!
  cardId: ID!
}

union BoardEvent =
  | BoardRenamed
  | BoardBackgroundChanged
  | InboxBackgroundChanged
  | ColumnCreated
  | ColumnMoved
  | ColumnRenamed
  | ColumnDeleted
  | CardCreated
  | CardMoved
  | CardUpdated
  | CardDeleted

type BoardEventEnvelope {
  boardId: ID!
  revision: Int!
  clientMutationId: ID
  actorId: ID!
  createdAt: String!
  event: BoardEvent!
}

# ================================
# Canvas - Dashboard Layer
# ================================

type CanvasListItem {
  id: ID!
  title: String!
  previewUrl: String
  updatedAt: String!
  membersCount: Int!
  myRole: MemberRole!
  myMemberId: ID!
  canEdit: Boolean!
  canDelete: Boolean!
  canManagePermissions: Boolean!
}

type CanvasPermissionsItem {
  id: ID!
  myRole: MemberRole!
  members: [CanvasMember!]!
  invites: [Invite!]!
}

type CanvasMember {
  id: ID!
  role: MemberRole!
  user: User!
  isSelf: Boolean!
  canRemove: Boolean!
  canChangeRole: Boolean!
  availableRoles: [MemberRole!]!
}

input UpdateCanvasInput {
  title: String
  previewImage: Upload
  removePreview: Boolean
}

type DeleteCanvasPayload {
  id: ID!
}

type UpdateCanvasPayload {
  id: ID!
  title: String!
  previewUrl: String
}

type ChangeCanvasMemberRolePayload {
  canvasId: ID!
  updatedMembers: [CanvasMember!]!
}

# ================================
# Inputs
# ================================

input InviteUserInput {
  resourceId: ID!
  email: String!
  role: MemberRole!
}

input ChangeMemberRoleInput {
  memberId: ID!
  role: MemberRole!
}

input MoveTargetInput {
  container: CardContainer!
  columnId: ID
  index: Int!
}

input CardPatchInput {
  title: String
  completed: Boolean
}

# ================================
# Query
# ================================

type Query {
  me: User

  # Board
  board(boardId: ID!): Board!
  boardList: [BoardListItem!]!
  boardPermissions(boardId: ID!): BoardPermissionsItem!

  # Canvas
  canvasList: [CanvasListItem!]!
  canvasPermissions(canvasId: ID!): CanvasPermissionsItem!

  searchUserEmails(query: String!): [UserEmailLookup!]!
}

# ================================
# Mutation
# ================================

type Mutation {
  # Auth
  login(email: String!, password: String!): User!
  register(email: String!, name: String!, password: String!): User!
  logout: Boolean!
  refreshSession: Boolean!

  # ---- Board Dashboard ----
  createBoard(title: String!, previewUrl: Upload): BoardListItem!
  deleteBoard(boardId: ID!): DeleteBoardPayload!
  updateBoard(boardId: ID!, input: UpdateBoardInput!): UpdateBoardPayload!

  inviteBoardUser(input: InviteUserInput!): Invite!
  revokeBoardInvite(inviteId: ID!): RevokeInvitePayload!
  changeBoardMemberRole(input: ChangeMemberRoleInput!): ChangeBoardMemberRolePayload!
  removeBoardMember(memberId: ID!): RemoveMemberPayload!

  # ---- Board Realtime ----
  renameBoard(boardId: ID!, clientMutationId: ID!, title: String!): Boolean!
  updateBoardBackground(boardId: ID!, clientMutationId: ID!, background: BoardBackground!): Boolean!
  updateInboxBackground(boardId: ID!, clientMutationId: ID!, background: BoardBackground!): Boolean!
  createColumn(
    boardId: ID!
    clientMutationId: ID!
    clientId: ID!
    title: String!
    index: Int!
  ): Boolean!
  moveColumn(boardId: ID!, clientMutationId: ID!, columnId: ID!, toIndex: Int!): Boolean!
  renameColumn(boardId: ID!, clientMutationId: ID!, columnId: ID!, title: String!): Boolean!
  deleteColumn(boardId: ID!, clientMutationId: ID!, columnId: ID!): Boolean!
  createCard(
    boardId: ID!
    clientMutationId: ID!
    clientId: ID!
    title: String!
    container: CardContainer!
    columnId: ID
    index: Int!
  ): Boolean!
  moveCard(boardId: ID!, clientMutationId: ID!, cardId: ID!, to: MoveTargetInput!): Boolean!
  updateCard(boardId: ID!, clientMutationId: ID!, cardId: ID!, patch: CardPatchInput!): Boolean!
  deleteCard(boardId: ID!, clientMutationId: ID!, cardId: ID!): Boolean!

  # ---- Canvas Dashboard ----
  createCanvas(title: String!, previewUrl: Upload): CanvasListItem!
  deleteCanvas(canvasId: ID!): DeleteCanvasPayload!
  updateCanvas(canvasId: ID!, input: UpdateCanvasInput!): UpdateCanvasPayload!

  inviteCanvasUser(input: InviteUserInput!): Invite!
  revokeCanvasInvite(inviteId: ID!): RevokeInvitePayload!
  changeCanvasMemberRole(input: ChangeMemberRoleInput!): ChangeCanvasMemberRolePayload!
  removeCanvasMember(memberId: ID!): RemoveMemberPayload!

  # ---- Canvas Realtime ----
  renameCanvas(canvasId: ID!, title: String!): Boolean!
  sendCanvasDiff(canvasId: ID!, diff: JSON!): Boolean!
}

# ================================
# Subscription
# ================================

type Subscription {
  boardEvents(boardId: ID!): BoardEventEnvelope!
  canvasSession(id: ID!): JSON!
}
